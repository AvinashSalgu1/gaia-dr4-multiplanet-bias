[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gedi"
version = "0.3.0"
description = "GEDI (Gaia Exoplanet Detection and Inference): bias in Gaia DR4 planet detection, orbits and occurrence rates from unmodelled companions"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
